[project]
name = "task-api"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"  # прод и CI на 3.11

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "W292"]  # длина строк и финальный \n — забота ruff format

[tool.ruff.lint.per-file-ignores]
"app/agent/tools.py" = ["E402"]  # импорты после настройки окружения, намеренно

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
