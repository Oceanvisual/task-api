name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # conftest подставляет dummy, но secret даёт реальный ключ, если задан
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'dummy-for-mocked-tests' }}
          # агент-тесты мокают тулы; флаг страхует от реального выхода в DuckDuckGo
          ENABLE_WEB_SEARCH: "false"
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-api:${{ github.sha }} .