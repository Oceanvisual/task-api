name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Только секрет. Остальное (base URL, model, top_k, эмбеддер) —
          # дефолты из app/config.py, общие для CI / локали / прода.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          QDRANT_URL: http://localhost:6333

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/task-api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/rag-service
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Только секреты. Имя модели, base URL, top_k и т.д.
            # — дефолты из app/config.py.
            cat > .env <<'EOF'
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            QDRANT_URL=http://qdrant:6333
            EOF
            # strip YAML-leading spaces from heredoc body
            sed -i 's/^[[:space:]]*//' .env

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:latest
            docker tag ${{ env.IMAGE }}:latest task-api:latest
            docker rm -f task-api 2>/dev/null || true
            # qdrant уже крутится на mentoring-net — не трогаем
            docker compose up -d --no-deps --force-recreate app
            docker logout ghcr.io
