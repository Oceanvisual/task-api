name: Claude review

# AI-ревью каждого PR. Активируется сам, когда в репо появится секрет CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token` локально -> gh secret set CLAUDE_CODE_OAUTH_TOKEN). Без секрета — skip, CI не краснеет.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - id: token
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=$([ -n "$T" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Отревьюь PR по правилам CLAUDE.md и docs/adr/ этого репо. Фокус:
            - баги и регрессии; нарушения «Жёстких ограничений» (Python 3.11, requirements.txt, пины langchain/ragas);
            - async/LLM: таймауты, ретраи, обработка ошибок провайдера, утечки секретов в логи;
            - есть ли тесты на новую логику (LLM замокан); изменения RAG без /rag-eval;
            - новое архитектурное решение без ADR.
            Только существенное, без стилистики (её ловит ruff). Пиши по-русски.
            Ветка PR уже в рабочей директории.
            `gh pr comment` — для общего итога; `mcp__github_inline_comment__create_inline_comment` (confirmed: true) — для конкретных строк.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
