version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      # ADR 0003: весь langchain/langgraph на 0.3.x-линии под ragas 0.2.15.
      # Полный игнор, а не update-types: для ranged-требований dependabot расширяет диапазон в обход update-types.
      # Security-апдейты при этом всё равно приходят.
      - dependency-name: "langchain*"
      - dependency-name: langgraph
      - dependency-name: ragas
      - dependency-name: torch
      - dependency-name: gradio
        versions: [">=7"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    ignore:
      # ADR 0002: прод на 3.11 — только патчи образа, без смены минорной версии Python
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
